<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryReg — Login Petugas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main class="login-section"><div class="container"><div class="login-card mx-auto">
    <div class="login-mark">LR</div><span class="eyebrow">AREA PETUGAS</span><h1 class="h2 mt-2">Login Petugas</h1><p class="text-muted">Masuk ke simulasi area pengelolaan LibraryReg.</p>
    <div id="login-alert" aria-live="polite"></div>
    <form id="login-form">
      <div class="mb-3"><label for="login-email" class="form-label">Email petugas</label><input class="form-control" type="email" id="login-email" required placeholder="petugas@libraryreg.test"></div>
      <div class="mb-3"><label for="login-password" class="form-label">Kata sandi</label><input class="form-control" type="password" id="login-password" required placeholder="Masukkan kata sandi"></div>
      <button class="btn btn-library w-100 mt-2" type="submit">Masuk</button>
    </form>
    <div class="demo-credentials mt-4"><strong>Demo login</strong><br>Email: <code>petugas@libraryreg.test</code><br>Kata sandi: <code>petugas123</code></div>
    <p class="small text-muted mt-3 mb-0">Ini hanya simulasi front-end. Kredensial tidak aman untuk penggunaan nyata dan tidak boleh dipakai sebagai sistem autentikasi sungguhan.</p>
  </div></div></main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script>
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', function(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const alertBox = document.getElementById('login-alert');
      if (email === 'petugas@libraryreg.test' && password === 'petugas123') {
        sessionStorage.setItem('libraryregStaffLoggedIn', 'true');
        alertBox.innerHTML = '<div class="alert alert-success">Login simulasi berhasil. Mengarahkan ke daftar anggota...</div>';
        setTimeout(() => window.location.href = 'anggota.html', 700);
      } else {
        alertBox.innerHTML = '<div class="alert alert-danger">Email atau kata sandi demo tidak sesuai.</div>';
      }
    });
  </script>
</body></html>
